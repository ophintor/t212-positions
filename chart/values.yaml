replicaCount: 1

namespace: papishares

image:
  repository: ophintor/papishares
  # Immutable, date-based tag - same scheme as ophintor/jenkins-agent. A
  # floating "latest" gives ArgoCD nothing to compare: the manifest never
  # changes, so a rebuilt image is invisible to it and rollback is impossible.
  # Bump this line to deploy a new build; that commit IS the deployment.
  tag: "2026.07.09-1"
  # Safe now the tag is immutable, and one less registry round-trip per pod
  # start on a machine that does not have any to spare.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

containerPort: 5000

probes:
  enabled: false

readinessProbe:
  path: /health
  port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2

livenessProbe:
  path: /health
  port: 5000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2

nodeSelector: {}

tolerations: []

affinity: {}

# The Secret itself is NOT rendered by this chart any more - it is a
# SealedSecret in korea-k8s-charts (argocd/sealed-secrets/papishares-*.yaml).
# `enabled` still gates the envFrom reference in deployment.yaml.
secrets:
  enabled: true
  name: papishares-secrets

entriesVolume:
  hostPath: /home/dp/agent_shared_fs/papishares
  mountPath: /entries

ingress:
  enabled: true
  className: nginx
  annotations:
      cert-manager.io/cluster-issuer: ca-issuer
  hosts:
    - host: papishares.papichulo
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - papishares.papichulo
      secretName: papishares-tls

autoscaling:
  enabled: false
  # minReplicas: 1
  # maxReplicas: 5
  # targetCPUUtilizationPercentage: 80

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

extraEnv:
  - name: "DB_PATH"
    value: "/data/papishares.db"
  - name: "ENTRIES_PATH"
    value: "/entries/suggested_entries.json"
