replicaCount: 1

namespace: papishares

image:
  repository: ghcr.io/ophintor/papishares
  # No tag. It falls back to this chart's appVersion, which the release workflow
  # stamps with the version it is releasing -- so what is deployed is derived
  # from the tag ArgoCD is pinned to and the two cannot disagree. This used to
  # be a hand-bumped date string, and the commit that changed it was the
  # deployment; now the release is.
  pullPolicy: IfNotPresent

# The package is private, matching the repository, so the cluster supplies a
# credential to pull it. The chart ships none.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 5000

containerPort: 5000

probes:
  enabled: false

readinessProbe:
  path: /health
  port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2

livenessProbe:
  path: /health
  port: 5000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2

nodeSelector: {}

tolerations: []

affinity: {}

# The Secret itself is NOT rendered by this chart any more - it is a
# SealedSecret in korea-k8s-charts (argocd/sealed-secrets/papishares-*.yaml).
# `enabled` still gates the envFrom reference in deployment.yaml.
secrets:
  enabled: true
  name: papishares-secrets

entriesVolume:
  # A path on a specific machine, so the cluster supplies it.
  hostPath: ""
  mountPath: /entries

# No hostname, ingress class or issuer here: they name one cluster, and a chart
# that ships someone else's hostname installs happily and then serves nothing.
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false
  # minReplicas: 1
  # maxReplicas: 5
  # targetCPUUtilizationPercentage: 80

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

extraEnv:
  - name: "DB_PATH"
    value: "/data/papishares.db"
  - name: "ENTRIES_PATH"
    value: "/entries/suggested_entries.json"
