apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "papishares.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{ include "papishares.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate. The app keeps its state in a single SQLite
  # file on a ReadWriteOnce volume, and SQLite allows exactly one writer. The
  # default strategy (maxSurge 25%, which rounds up to 1) starts the new pod
  # BEFORE removing the old one - and on a single node RWO happily lets both
  # mount the same claim, so for the length of every rollout two Flask
  # processes write the same database. Recreate stops the old pod first.
  # Cost: a few seconds of downtime per deploy, which is the right trade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "papishares.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "papishares.fullname" . }}
      annotations: {{ toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: papishares
          {{- /* Falls back to the chart's own appVersion, which the release
              workflow stamps with the version being released -- so the deployed
              version is derived from the tag ArgoCD is pinned to and cannot
              drift from it. A Helm comment, not a YAML one: a `#` here is
              emitted into the manifest sent to the API. */}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.secrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          {{- end }}
          env:
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ quote .value }}
            {{- end }}
          volumeMounts:
            - name: sqlite3-storage
              mountPath: /data
            - name: entries-storage
              mountPath: {{ .Values.entriesVolume.mountPath }}
              readOnly: true
      volumes:
        - name: sqlite3-storage
          persistentVolumeClaim:
            claimName: sqlite3-pvc
        - name: entries-storage
          hostPath:
            path: {{ .Values.entriesVolume.hostPath }}
            type: DirectoryOrCreate
